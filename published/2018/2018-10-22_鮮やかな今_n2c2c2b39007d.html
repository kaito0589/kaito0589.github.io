<h1>鮮やかな今</h1>
<div class="meta">2018.10.22</div>
<article>
<figure name="06ccc771-62aa-4691-91c4-b0ef416f2142"><img src="../../assets/n2c2c2b39007d_99d27a5922f8499a0ea262848265594b.jpg"><figcaption></figcaption></figure><p name="ec43b2a5-2510-45de-983d-d89c9bd95b5a" id="ec43b2a5-2510-45de-983d-d89c9bd95b5a">　笑っちゃうくらいの大きな口を開けてさ、ばかなことを叫ぼう<br><br>　"今"がこれまでの自分の中でNo.1って言えるように、何もかも楽しんじゃえ<br><br><br><br>　わかっているさ<br>　日に日に"純粋さ"は瑞々しさを失っていること</p><p name="79e5f56e-7756-4219-a22b-1280fe04c16e" id="79e5f56e-7756-4219-a22b-1280fe04c16e">　気づいているさ<br>　かつての"若々しさ"はどこかに行ってしまったこと</p><p name="0fb8c529-dfc6-4fb6-8e2c-011cebe26dc6" id="0fb8c529-dfc6-4fb6-8e2c-011cebe26dc6"><br></p><p name="158d0675-2566-41ef-99cc-0b8deddd1d02" id="158d0675-2566-41ef-99cc-0b8deddd1d02"><br>　でも、知っておきたいんだ<br>　世界は休みなく"色"を放っている事実を<br><br>　研ぎ澄ましておきたいんだ<br>　まだまだ終わりそうにない命の"情緒"を感じるために</p><p name="76b3035d-5b44-4a33-a788-aeb5122578f3" id="76b3035d-5b44-4a33-a788-aeb5122578f3"><br></p><p name="a7cd1c47-53b0-4eb4-84f6-b03f9fdbb834" id="a7cd1c47-53b0-4eb4-84f6-b03f9fdbb834"><br><br>　鮮やかな今は、輝かしい"君の未来"そのもの</p>
</article>
