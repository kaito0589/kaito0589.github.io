<h1>Seize The Day</h1>
<div class="meta">2018.01.18</div>
<article>
<figure name="4897756f-2642-404b-982d-2dd852268999"><img src="../../assets/n65c71603806c_80303a8ec8ff62e8b0fe794c3cd8730d.jpg"><figcaption></figcaption></figure><p name="1d8e9168-4c2a-4afb-a796-4306eb8889c0" id="1d8e9168-4c2a-4afb-a796-4306eb8889c0">　さあ　踊ろうよ<br>　体も心も　なにもかもからっぽにして<br><br>　どんな雰囲気がすき？<br>　どんなメロディーがいい？<br><br>　君のいきいきした姿を　僕にもみせてよ<br>　ほら　世界は思ってたより広くて輝いてる<br><br>　誰かに気づかれたって<br>　はずかしがらずに　夢中になって<br><br>　夜はこれからさ<br>　いつか音楽が鳴りやんでも　笑い合っていよう<br><br>　さあ　手をかして<br>　今　この瞬間を　いっしょに楽しみたいんだ</p>
