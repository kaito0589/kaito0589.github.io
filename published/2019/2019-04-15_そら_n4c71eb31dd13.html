<article>
<figure name="e826378a-8112-464f-a4a3-350e6f5c8fd2"><img src="../../assets/n4c71eb31dd13_267a63210e8c902af0c21e1132d7f6a6.jpg"><figcaption></figcaption></figure><p name="3a956956-2930-40ba-8f75-a4283d92c80d" id="3a956956-2930-40ba-8f75-a4283d92c80d">　そら<br><br>　くもひとつないそら<br><br>　どこまでもつづくあおぞら</p><p name="0f747807-9c2e-424a-b88c-5ffb13c34772" id="0f747807-9c2e-424a-b88c-5ffb13c34772"><br><br>　そら<br><br>　まっくらなそら<br><br>　さんさんとかがやくほしぞら</p><p name="c72d4342-1981-4064-bac0-7adda85e29e6" id="c72d4342-1981-4064-bac0-7adda85e29e6"><br><br>　たんさんすいへ　せんすいして<br><br>　おだやかなねむけに　さそわれるような<br><br>　そんなふしぎなかんかくが　せかいをかえるよ</p><p name="082b3092-3fd8-4f07-9428-f457b758120b" id="082b3092-3fd8-4f07-9428-f457b758120b"><br><br>　あら<br><br>　どうしたの<br><br>　いつものきみじゃないみたい</p><p name="1c32a9f1-be55-4ba3-a20f-cb42f0788069" id="1c32a9f1-be55-4ba3-a20f-cb42f0788069"><br><br>　どら<br><br>　いまのきもち<br><br>　わたしにはなしておくれよ</p><p name="71b78650-9cce-4aca-a2b1-f148e07f4dae" id="71b78650-9cce-4aca-a2b1-f148e07f4dae"><br><br>　ほら<br><br>　ぜんぶうけとめるさ<br><br>　このそらのしたにいきているかぎりは</p>
