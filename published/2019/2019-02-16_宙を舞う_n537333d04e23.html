<h1>宙を舞う</h1>
<div class="meta">2019.02.16</div>
<article>
<figure name="207c542c-9fa0-4121-bbf5-622d1e0191a1"><img src="../../assets/n537333d04e23_a4c51adf7ef14a49fde5c99dae0a79ef.jpg"><figcaption></figcaption></figure><p name="3d20270b-d3bc-46c5-b96c-358e4025857e" id="3d20270b-d3bc-46c5-b96c-358e4025857e">　水平を漂う僕らの境界線は<br><br>　曖昧な陽炎みたいにゆらゆら揺れてる<br><br>　誰もがその向こう側に行きたいと願ってる<br><br>　口に出すことは無粋だって　みんなそう思ってるけど</p><p name="c7edf1c7-e2bf-46ed-be46-62574cb91507" id="c7edf1c7-e2bf-46ed-be46-62574cb91507"><br>　ほかの誰でもない証を<br><br>　うねりを感じる心の有り様を<br><br>　今　ここに刻みこもう</p><p name="e6aa22ef-ba0e-48f7-828d-96603b39ef78" id="e6aa22ef-ba0e-48f7-828d-96603b39ef78"><br>　僕ら自身の想いで<br><br>　貴方自身の言葉で<br><br>　混沌とした群像に<br><br>　一筋の光を届けよう</p><p name="772f12e9-8bce-4780-b9a5-42075808201e" id="772f12e9-8bce-4780-b9a5-42075808201e"><br></p><p name="67e03d11-ff4a-4ab8-8c95-33d63756cfde" id="67e03d11-ff4a-4ab8-8c95-33d63756cfde"><br><br>　舞い上がれ<br>　広大な宇宙の片隅で<br><br>　舞い上がっていけ<br>　世界を轟かす息吹の中を</p><p name="08c03b64-07a3-40e8-9f98-e963f31e8b47" id="08c03b64-07a3-40e8-9f98-e963f31e8b47"><br></p><p name="85be2435-5eba-43fd-892a-2c5a88ddcbe1" id="85be2435-5eba-43fd-892a-2c5a88ddcbe1"><br>　宙を舞う無数の魂は<br><br>　いつか風となって　遥かなる未来へとバトンを渡すんだ<br></p>
</article>
