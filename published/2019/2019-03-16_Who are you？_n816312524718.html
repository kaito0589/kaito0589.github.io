<figure name="6c54a5e4-f65a-40cb-bb67-6f12a23c175d"><img src="../../assets/n816312524718_faff881d30fb68a08f5f5ecfd84ca197.jpg"><figcaption></figcaption></figure><p name="e0f725fa-1851-4861-83b7-57d707f13049" id="e0f725fa-1851-4861-83b7-57d707f13049">　さらけ出していいよ　綺麗事ばかりは疲れたろ？<br><br>　分かろうとしなくていい　正直なキミのすべてを知りたい<br><br><br>　取り繕うのが大人　じゃあ本音を吐き出すのは誰？<br><br>　わがままをいうのが子ども　じゃあ相手の心を想うのは誰？<br><br><br>　枠に囚われなくたっていい<br>　焦ってまで何者かにならなくていいさ<br><br>　ゆっくりで構わない<br>　社会のスピードに追いつく必要なんてない<br><br>　生きてる限り　自分が自分でいる限り<br>　キミはキミ　ボクはボクでいいんだ<br><br><br><br>　それが"自由"ってことだと　心から信じて</p>
