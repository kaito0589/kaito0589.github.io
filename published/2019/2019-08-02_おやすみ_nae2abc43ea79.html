<h1>おやすみ</h1>
<div class="meta">2019.08.02</div>
<article>
<figure name="efb67d16-54ce-4950-808c-136e260ea628"><img src="../../assets/nae2abc43ea79_b43d7718740a9b472d12dce126442a09.jpg"><figcaption></figcaption></figure><p name="ea48775f-e1da-4236-813f-4d9bbe046fcd" id="ea48775f-e1da-4236-813f-4d9bbe046fcd">　そろそろ眠りにつこうよ<br>　難しいことは全部忘れてしまってさ<br><br>　重たげな目をこすって<br>　無理をしなくていいよ<br>　明日の君なら<br>　きっと大丈夫さ<br><br><br>　夢の中でなら<br>　思い切り好きなことができるんだ<br><br>　鳥のように空を飛んだり<br>　イルカみたいに軽やかに泳ぐことだって<br><br><br>　さあ、何処に行きたい？<br>　自由に思っていることを伝えておくれ<br><br><br>　誰も立ち入ることのできない　唯一の世界<br>　夜の静かな空気が　無重力な僕らの心を解き放ってくれるんだ</p>
