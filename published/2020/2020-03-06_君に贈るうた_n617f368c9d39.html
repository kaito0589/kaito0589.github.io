<h1>君に贈るうた</h1>
<div class="meta">2020.03.06</div>
<article>
<figure name="72949ebd-0d2f-4411-904d-5157685b1053"><img src="../../assets/n617f368c9d39_fbe844756b9be901eaa2e95f066948f7.jpg"><figcaption></figcaption></figure><p name="2282443e-c628-4bd8-87ed-9d5a5bc30e28" id="2282443e-c628-4bd8-87ed-9d5a5bc30e28">　忙しない毎日の中<br>　昨日のことすら簡単に忘れてしまうけど<br><br>　移ろいゆく風景の中<br>　慣れ親しんだ街並みも姿を変えていくけれど<br><br>　目を瞑れば懐かしい君の笑顔<br><br>　ギターの音色　歌う口元<br>　たくさんの声を聴いてきたはずなのに<br><br>　ばいばい<br>　その言葉だけがずっと残ってる<br><br>　無理はしなくていいよ<br>　君の道を行ってほしい<br><br>　気にしなくていいよ<br>　君の夢へ迷わず進んでほしい<br><br>　口べたな想いを言えずに別れた街角で<br>　歩き出す僕らはまたきっと巡り合うよ</p>
