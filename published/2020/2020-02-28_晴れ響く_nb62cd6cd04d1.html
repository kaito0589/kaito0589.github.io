<h1>晴れ響く</h1>
<div class="meta">2020.02.28</div>
<article>
<figure name="31e89a39-2bb8-4176-a61b-69525d7da142"><img src="../../assets/nb62cd6cd04d1_6bc4e30be48a7bb662005ca76cc9ec45.jpg"><figcaption></figcaption></figure><p name="f8f21091-085a-4b7f-a809-961436a4e761" id="f8f21091-085a-4b7f-a809-961436a4e761">　ついにやってきたよ<br>　君だけの晴れ舞台が<br><br>　今日は特別さ<br>　とっておきの衣装を身にまとい<br><br>　今から踏み出す一歩で<br>　何もかもを塗り替えていこう<br><br>　たくさんの人が集まっても<br>　僕の瞳をまっすぐ見て<br><br>　ゆっくりと呼吸を整えたら<br>　みなぎる命が輝く時<br><br>　夏の陽射しや吹き抜ける風<br>　全部味方につけてさ<br><br>　笑い合える友だち<br>　大切な人はいつも傍にいるから<br><br>　さあ想いを聴かせてよ<br>　一緒に未来を作りたいんだ<br><br>　新たな世界へ告げる鐘を<br>　晴れ渡る空へ響かせよう</p>
</article>
