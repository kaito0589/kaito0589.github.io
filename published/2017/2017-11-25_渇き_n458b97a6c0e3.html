<h1>渇き</h1>
<div class="meta">2017.11.25</div>
<article>
<figure name="4424b597-1fee-4631-bf86-9ded4bcb3cd9"><img src="../../assets/n458b97a6c0e3_6d3ea4c8171cc672f055f6e8bccf0903.jpg"><figcaption></figcaption></figure><p name="db65f765-f3b6-4158-913d-63df76b1455c" id="db65f765-f3b6-4158-913d-63df76b1455c">　ああ、君が欲しい。<br>　荒れ果てた砂漠には何もない。水も、風も。<br><br><br>　じりじりと体力が奪われる。<br>　太陽に勝つ方法なんかありゃしない。<br><br><br>　でも、僕は歩き続ける。みんなから笑われ、無駄なことだと言われても。<br><br><br>　どこかにいる君を見つけ出すために。<br><br><br>　ああ、君が欲しい。<br>　ありふれた平和な暮らしを失い、自分の命を削ってでも。<br><br><br>　そして、何もかも壊したい。<br>　常識の壁を、自分のひ弱な心までも。<br><br><br>　ああ、心から愛している。<br>　だから、早く僕の目の前に現れてくれ。</p>
